[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vic-election"
version = "0.1.0"
description = "Victorian State Election 2026 Preferential Voting (IRV) Engine & 2022 VEC Empirical Verification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA"]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
